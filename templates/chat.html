<!DOCTYPE html>
<html>
<head>
    <title>Medical Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 700px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: #2c7be5;
            color: white;
            padding: 20px;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }
        .chat-header h2 { font-size: 1.4rem; }
        .chat-header p { font-size: 0.85rem; opacity: 0.8; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user-message {
            background: #2c7be5;
            color: white;
            align-self: flex-end;
            border-radius: 12px 12px 0 12px;
        }
        .bot-message {
            background: #f0f2f5;
            color: #333;
            align-self: flex-start;
            border-radius: 12px 12px 12px 0;
        }
        .typing {
            background: #f0f2f5;
            color: #888;
            align-self: flex-start;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .chat-input {
            padding: 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-input input:focus { border-color: #2c7be5; }
        .chat-input button {
            padding: 12px 24px;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .chat-input button:hover { background: #1a68d1; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>🏥 Medical Chatbot</h2>
            <p>Powered by RAG + Llama3 + Pinecone</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Namaste! Main aapka medical assistant hoon. 
                Koi bhi medical question poochh sakte hain! 🩺
            </div>
        </div>
        
        <div class="chat-input">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Medical question poochho..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;
            
            // User message show karo
            addMessage(msg, 'user');
            input.value = '';
            
            // Typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.id = 'typing';
            typingDiv.textContent = '🤔 Thinking...';
            document.getElementById('chatMessages').appendChild(typingDiv);
            scrollToBottom();
            
            // API call
            fetch('/get', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'msg=' + encodeURIComponent(msg)
            })
            .then(r => r.text())
            .then(response => {
                document.getElementById('typing')?.remove();
                addMessage(response, 'bot');
            })
            .catch(err => {
                document.getElementById('typing')?.remove();
                addMessage('Error: ' + err, 'bot');
            });
        }
        
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            div.textContent = text;
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }
        
        function scrollToBottom() {
            const msgs = document.getElementById('chatMessages');
            msgs.scrollTop = msgs.scrollHeight;
        }
    </script>
</body>
</html>
